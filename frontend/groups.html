<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <main>
    <h1>Groups</h1>

    <form id="create-form" class="create-form">
      <input type="text" id="new-name" class="text-input" placeholder="New group name" required>

      <button type="submit" class="add-btn">Create</button>

    <p class="error-msg hidden" id="error-msg"></p>
    <p class="loading" id="loading">Loading</p>
    <div id="content" hidden></div>

  <footer class="docs-footer">
