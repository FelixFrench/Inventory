<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inventory — Low Stock</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: system-ui, sans-serif; background: #f5f5f5; color: #1a1a1a; min-height: 100vh; display: flex; flex-direction: column; }
    header { background: #1a1a1a; color: #fff; padding: 16px 20px; font-size: 1.1rem; font-weight: 600; }
    nav { background: #2a2a2a; display: flex; gap: 0; }
    nav a { color: #ccc; text-decoration: none; padding: 12px 20px; font-size: 0.95rem; }
    nav a:hover { background: #3a3a3a; color: #fff; }
    nav a.active { color: #fff; border-bottom: 3px solid #4a9eff; }
    main { flex: 1; padding: 24px 16px; max-width: 800px; margin: 0 auto; width: 100%; }
    h1 { font-size: 1.4rem; margin-bottom: 20px; color: #1a1a1a; }
    .loading { color: #666; font-size: 1rem; padding: 32px 0; text-align: center; }
    .loading::after { content: ''; display: inline-block; width: 20px; height: 20px; border: 3px solid #ccc; border-top-color: #444; border-radius: 50%; animation: spin 0.8s linear infinite; margin-left: 10px; vertical-align: middle; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .empty { color: #2d7d46; background: #eaf6ed; border: 1px solid #b8e0c2; border-radius: 8px; padding: 20px 16px; text-align: center; font-size: 1rem; }
    .error-msg { color: #c0392b; background: #fdf0ef; border: 1px solid #f5c6c2; border-radius: 8px; padding: 12px 16px; margin-bottom: 16px; }
    table { width: 100%; border-collapse: collapse; background: #fff; border-radius: 10px; overflow: hidden; box-shadow: 0 1px 4px rgba(0,0,0,0.08); }
    th { background: #1a1a1a; color: #fff; text-align: left; padding: 12px 14px; font-size: 0.85rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.04em; }
    th.shortfall-col, td.shortfall-col { text-align: center; }
    td { padding: 13px 14px; border-bottom: 1px solid #eee; font-size: 0.95rem; vertical-align: top; }
    tr:last-child td { border-bottom: none; }
    tr:hover td { background: #f9f9f9; }
    .brand { color: #666; font-size: 0.85rem; margin-top: 2px; }
    .shortfall-badge { display: inline-block; background: #c0392b; color: #fff; font-weight: 700; font-size: 1.1rem; border-radius: 50%; width: 36px; height: 36px; line-height: 36px; text-align: center; }
  </style>
</head>
<body>
  <header>Inventory</header>
  <nav>
    <a href="/">Mode</a>
    <a href="/inventory.html">Inventory</a>
    <a href="/low_stock.html" class="active">Low Stock</a>
  </nav>
  <main>
    <h1>Low Stock</h1>
    <div class="error-msg" id="error-msg" style="display:none"></div>
    <div class="loading" id="loading">Loading</div>
    <div id="content" style="display:none"></div>
  </main>
  <script>
    function render(data) {
      const el = document.getElementById('content');
      if (data.items.length === 0) {
        el.innerHTML = '<p class="empty">All items are sufficiently stocked.</p>';
      } else {
        const rows = data.items.map(item => `
          <tr>
            <td>
              <div>${item.name ?? '—'}</div>
              ${item.brand ? '<div class="brand">' + item.brand + '</div>' : ''}
            </td>
            <td>${item.quantity}</td>
            <td>${item.minimum_quantity}</td>
            <td class="shortfall-col"><span class="shortfall-badge">${item.shortfall}</span></td>
          </tr>`).join('');
        el.innerHTML = `
          <table>
            <thead>
              <tr>
                <th>Item</th>
                <th>Have</th>
                <th>Need</th>
                <th class="shortfall-col">Short</th>
              </tr>
            </thead>
            <tbody>${rows}</tbody>
          </table>`;
      }
      document.getElementById('loading').style.display = 'none';
      el.style.display = '';
    }

    (async function init() {
      try {
        const resp = await fetch('/reports/low-stock');
        if (!resp.ok) throw new Error('Server error ' + resp.status);
        render(await resp.json());
      } catch (e) {
        document.getElementById('loading').style.display = 'none';
        const err = document.getElementById('error-msg');
        err.textContent = 'Could not load low stock report. Check connection.';
        err.style.display = '';
      }
    })();
  </script>
</body>
</html>
