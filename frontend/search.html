<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inventory — Search</title>
  <link rel="stylesheet" href="base.css">
  <link rel="stylesheet" href="docs-nav.css">
  <link rel="stylesheet" href="search.css">
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" href="/icons/icon-192.png" type="image/png">
</head>
<body>
  <header>Inventory</header>
  <nav>
    <a href="/inventory.html">Inventory</a>
    <a href="/low_stock.html">Low Stock</a>
    <a href="/feed.html">Feed</a>
    <a href="/unresolved.html">Unresolved</a>
    <a href="/groups.html">Groups</a>
    <a href="/search.html" class="active">Search</a>
  </nav>
  <main>
    <h1>Search</h1>
    <p class="search-hint">Scan a barcode, or type one below, to open its product page.</p>
    <form id="search-form" class="search-form" autocomplete="off">
      <input id="search-input" class="search-input" type="text" inputmode="numeric"
             placeholder="Barcode" aria-label="Barcode" required>
      <button id="search-btn" class="search-btn" type="submit">Go</button>
    </form>
    <p id="search-status" class="search-status" aria-live="polite"></p>
  </main>
  <footer class="docs-footer">
    <a href="#" id="docs-link">API Docs</a>
  </footer>

  <script src="/config.js"></script>
  <script src="/docs-nav.js"></script>
  <script src="/shared-utils.js"></script>
  <script src="/search.js"></script>
</body>
</html>
