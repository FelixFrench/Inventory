<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Spike A — WebSocket Test</title>
  <style>
    body { font-family: monospace; padding: 1rem; background: #111; color: #eee; }
    #log { border: 1px solid #444; padding: 0.5rem; height: 400px; overflow-y: auto; }
    .entry { margin: 2px 0; }
    .ts { color: #888; }
  </style>
</head>
<body>
  <h2>Spike A — WebSocket Test</h2>
  <div id="log"></div>

  <script>
    function log(msg) {
      const ts = new Date().toISOString().slice(11, 23);
      const el = document.createElement('div');
      el.className = 'entry';
      el.innerHTML = `<span class="ts">[${ts}]</span> ${msg}`;
      document.getElementById('log').appendChild(el);
      document.getElementById('log').scrollTop = 9999;
      console.log(ts, msg);
    }

    let reconnectDelay = 1000;

    function connect() {
      const ws = new WebSocket(`ws://${location.host}/ws`);

      ws.onopen = () => {
        reconnectDelay = 1000;
        log('Connected');
        ws.send(JSON.stringify({ type: 'ping' }));
      };

      ws.onmessage = (event) => {
        log('Message: ' + event.data);
      };

      ws.onerror = (event) => {
        log('Error: ' + (event.message || 'WebSocket error'));
      };

      ws.onclose = () => {
        log(`Disconnected. Reconnecting in ${reconnectDelay}ms…`);
        setTimeout(connect, reconnectDelay);
        reconnectDelay = Math.min(reconnectDelay * 2, 30000);
      };
    }

    connect();
  </script>
</body>
</html>
